{% if metrics %}
<table>
  <thead>
    <tr><th>Date</th><th>Weight</th><th>Calories</th></tr>
  </thead>
  <tbody>
    {% for m in metrics %}
    <tr>
      <td>{{ m.recorded_at[:10] | human_date }}</td>
      <td><span class="weight-display" data-kg="{{ m.weight_kg }}">{{ m.weight_kg }} kg</span></td>
      <td>{{ m.calories or "—" }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p style="color:var(--muted); font-size:0.875rem;">No entries yet.</p>
{% endif %}
