<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Fitness Tracker{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0d0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js" defer></script>
  <script src="https://unpkg.com/lucide@0.378.0/dist/umd/lucide.min.js" defer></script>
  <style>
    :root {
      --bg:           #0d0f14;
      --surface:      #141720;
      --surface-2:    #1a1e27;
      --surface-hover:#1f2535;
      --border:       #252b3b;
      --text:         #e2e8f0;
      --muted:        #64748b;
      --accent:       #4f9cf9;
      --accent-hover: #7ab8fc;
      --accent-dim:   rgba(79,156,249,0.08);
      --danger:       #f87171;
      --success:      #34d399;
      --pr:           #f59e0b;
      --pr-dim:       rgba(245,158,11,0.12);
      --shadow-sm:    0 1px 3px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
      --shadow:       0 4px 16px rgba(0,0,0,0.5);
      --glow:         0 0 0 3px rgba(79,156,249,0.2);
      --glow-pr:      0 0 0 3px rgba(245,158,11,0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: 'Space Grotesk', system-ui, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 15px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }

    /* ── Nav ─────────────────────────────────────────── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 8px rgba(0,0,0,0.3);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      overflow-x: auto;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    nav .brand {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.01em;
      color: var(--text);
      padding: 0.875rem 0;
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    nav .brand-dot {
      width: 7px;
      height: 7px;
      background: var(--pr);
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(245,158,11,0.6);
    }
    nav .nav-links { display: flex; gap: 0; overflow-x: auto; }
    nav .nav-links a {
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.875rem 0.75rem;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    nav .nav-links a:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    nav .nav-links a.active { color: var(--text); }
    nav .nav-user {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }
    nav .nav-user .username {
      font-size: 0.825rem;
      color: var(--muted);
      white-space: nowrap;
      font-weight: 500;
    }

    /* ── Layout ──────────────────────────────────────── */
    .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }

    /* ── Cards ───────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
    }

    /* ── Buttons ─────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      min-height: 40px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f9cf9 0%, #3b82f6 100%);
      color: #0f172a;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #7ab8fc 0%, #4f9cf9 100%);
      box-shadow: 0 4px 12px rgba(79,156,249,0.3);
      transform: translateY(-1px);
    }
    .btn-danger { background: var(--danger); color: #0f172a; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover {
      color: var(--text);
      border-color: #3d4459;
      background: rgba(255,255,255,0.04);
    }

    /* ── Form fields ─────────────────────────────────── */
    input, select, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      font-family: inherit;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--glow);
    }
    label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
      display: block;
      margin-bottom: 0.3rem;
    }
    .form-group { margin-bottom: 1rem; }

    /* ── Tables ──────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border); }
    td a { display: block; }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.1s; }
    tbody tr:hover td { background: rgba(255,255,255,0.03); }

    /* ── Badges ──────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .badge-pr {
      background: var(--pr-dim);
      color: var(--pr);
      border: 1px solid rgba(245,158,11,0.3);
      font-family: 'JetBrains Mono', monospace;
    }
    .badge-streak {
      background: rgba(52,211,153,0.12);
      color: var(--success);
      border: 1px solid rgba(52,211,153,0.25);
    }

    /* ── Grids ───────────────────────────────────────── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }

    /* ── Section title ───────────────────────────────── */
    .section-title {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    /* ── Steppers ────────────────────────────────────── */
    .stepper-group { display: flex; align-items: center; gap: 0.5rem; }
    .stepper-group input { text-align: center; width: 80px; }
    .stepper-btn {
      width: 40px;
      height: 40px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .stepper-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    /* ── Numeric typography ──────────────────────────── */
    .num { font-family: 'JetBrains Mono', monospace; }

    /* ── Flash messages ──────────────────────────────── */
    .flash {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.875rem;
    }
    .flash-success {
      background: rgba(52,211,153,0.08);
      border: 1px solid rgba(52,211,153,0.25);
      color: var(--success);
    }
    .flash-error {
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.25);
      color: var(--danger);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <span class="brand">
      <span class="brand-dot"></span>
      FitTrack
    </span>
    <div class="nav-links">
      <a href="/">Dashboard</a>
      <a href="/workouts"><i data-lucide="dumbbell" style="width:16px;height:16px;margin-right:0.3rem;"></i>Workouts</a>
      <a href="/exercises"><i data-lucide="list" style="width:16px;height:16px;margin-right:0.3rem;"></i>Exercises</a>
      <a href="/metrics"><i data-lucide="trending-up" style="width:16px;height:16px;margin-right:0.3rem;"></i>Body Metrics</a>
      <a href="/export/workouts.csv"><i data-lucide="download" style="width:16px;height:16px;margin-right:0.3rem;"></i>Export CSV</a>
      {% if user.is_admin %}
      <a href="/invite"><i data-lucide="user-plus" style="width:16px;height:16px;margin-right:0.3rem;"></i>Invite</a>
      {% endif %}
    </div>
    <div class="nav-user">
      <a href="/settings" class="username" style="color:var(--muted);">{{ user.username }}</a>
      <form method="post" action="/logout" style="display:flex;align-items:center;">
        <button type="submit" class="btn btn-ghost"
                style="min-height:34px;padding:0.35rem 0.75rem;font-size:0.8rem;white-space:nowrap;">
          Sign out
        </button>
      </form>
    </div>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
    document.querySelectorAll('.nav-links a').forEach(function(a) {
      var linkPath = new URL(a.href).pathname;
      var here = location.pathname;
      if (linkPath === '/' ? here === '/' : here === linkPath || here.startsWith(linkPath + '/')) {
        a.classList.add('active');
      }
    });
    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
    document.addEventListener('htmx:afterSwap', () => lucide.createIcons());
  </script>
</body>
</html>
