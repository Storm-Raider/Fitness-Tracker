<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Fitness Tracker{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0d0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/lucide.min.js" defer></script>
  <style>
    :root {
      --bg:           #090b10;
      --surface:      #0f1219;
      --surface-2:    #161b24;
      --surface-hover:#1c2230;
      --border:       #1e2334;
      --text:         #e4eaf2;
      --muted:        #5a6a82;
      --accent:       #4f9cf9;
      --accent-hover: #7ab8fc;
      --accent-dim:   rgba(79,156,249,0.09);
      --danger:       #f87171;
      --success:      #34d399;
      --pr:           #f59e0b;
      --pr-dim:       rgba(245,158,11,0.12);
      --shadow-sm:    0 1px 3px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
      --shadow:       0 6px 20px rgba(0,0,0,0.6);
      --glow:         0 0 0 3px rgba(79,156,249,0.22);
      --glow-pr:      0 0 0 3px rgba(245,158,11,0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: 'Barlow', system-ui, sans-serif; }
    body {
      background: var(--bg);
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 0);
      background-size: 28px 28px;
      color: var(--text);
      font-family: 'Barlow', system-ui, sans-serif;
      font-size: 15px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    h1, h2, h3 {
      font-family: 'Syne', system-ui, sans-serif;
      letter-spacing: -0.02em;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }

    /* ── Nav ─────────────────────────────────────────── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 12px rgba(0,0,0,0.5);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      position: sticky;
      top: 0;
      z-index: 50;
      min-height: 52px;
      flex-wrap: wrap;
    }
    nav .brand {
      font-family: 'Syne', system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      height: 52px;
    }
    nav .brand-dot {
      width: 6px;
      height: 6px;
      background: var(--pr);
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(245,158,11,0.7);
    }
    nav .nav-sep {
      width: 1px;
      height: 18px;
      background: var(--border);
      flex-shrink: 0;
    }
    nav .nav-links { display: flex; gap: 0; }
    nav .nav-links a {
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0 0.875rem;
      height: 52px;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      position: relative;
      transition: color 0.15s;
    }
    nav .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0.875rem;
      right: 0.875rem;
      height: 2px;
      background: var(--accent);
      border-radius: 1px 1px 0 0;
      transform: scaleX(0);
      opacity: 0.5;
      transition: transform 0.2s ease, opacity 0.15s;
    }
    nav .nav-links a:hover { color: var(--text); }
    nav .nav-links a:hover::after { transform: scaleX(1); }
    nav .nav-links a.active { color: var(--text); }
    nav .nav-links a.active::after { transform: scaleX(1); opacity: 1; }
    nav .nav-user {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
      background: var(--surface-2);
      border: 1px solid #2a3248;
      border-radius: 10px;
      padding: 0.2rem 0.2rem 0.2rem 0.75rem;
    }
    nav .nav-user .username {
      font-size: 0.825rem;
      color: var(--text);
      white-space: nowrap;
      font-weight: 500;
      transition: color 0.15s;
    }
    nav .nav-user .username:hover { color: var(--accent); }
    /* Hamburger — hidden on desktop */
    .nav-hamburger {
      display: none;
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      padding: 0.35rem;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
    }
    .nav-hamburger:hover { border-color: var(--accent); color: var(--accent); }
    /* Mobile user row inside dropdown */
    .nav-mobile-user { display: none; }

    @media (max-width: 767px) {
      nav {
        padding: 0 1rem;
        gap: 0;
        overflow: visible;
      }
      nav .brand { margin-right: auto; }
      nav .nav-sep { display: none; }
      nav .nav-user { display: none; }
      .nav-hamburger { display: flex; }
      nav .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        border-top: 1px solid var(--border);
        padding: 0.375rem 0;
      }
      nav .nav-links.nav-open { display: flex; }
      nav .nav-links a {
        height: 48px;
        padding: 0 1rem;
        font-size: 0.9375rem;
        width: 100%;
      }
      nav .nav-links a::after { display: none; }
      nav .nav-links a.active {
        color: var(--accent);
        background: var(--accent-dim);
      }
      .nav-mobile-user {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1rem;
        border-top: 1px solid var(--border);
        margin-top: 0.25rem;
      }
      .nav-mobile-user .username {
        font-size: 0.825rem;
        color: var(--muted);
        font-weight: 500;
      }
    }

    /* ── Layout ──────────────────────────────────────── */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
      animation: fadeUp 0.25s ease both;
    }
    @media (max-width: 480px) {
      .container { padding: 1rem 0.75rem; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Cards ───────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.025) 0%, transparent 55%);
      pointer-events: none;
      border-radius: inherit;
    }

    /* ── Buttons ─────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      min-height: 38px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: 'Barlow', inherit;
      letter-spacing: 0.01em;
      transition: all 0.15s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f9cf9 0%, #3b82f6 100%);
      color: #fff;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #7ab8fc 0%, #4f9cf9 100%);
      box-shadow: 0 4px 16px rgba(79,156,249,0.35);
      transform: translateY(-1px);
    }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover {
      color: var(--text);
      border-color: #2a3248;
      background: rgba(255,255,255,0.04);
    }

    /* ── Form fields ─────────────────────────────────── */
    input, select, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      font-family: 'Barlow', inherit;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--glow);
    }
    label {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.35rem;
    }
    .form-group { margin-bottom: 1rem; }

    /* ── Tables ──────────────────────────────────────── */
    .card { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; min-width: 360px; }
    th {
      text-align: left;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border); }
    td a { display: block; }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.1s; }
    tbody tr:hover td { background: rgba(255,255,255,0.025); }

    /* ── Badges ──────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .badge-pr {
      background: var(--pr-dim);
      color: var(--pr);
      border: 1px solid rgba(245,158,11,0.3);
      font-family: 'JetBrains Mono', monospace;
    }
    .badge-streak {
      background: rgba(52,211,153,0.1);
      color: var(--success);
      border: 1px solid rgba(52,211,153,0.25);
    }

    /* ── Grids ───────────────────────────────────────── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }

    /* ── Section title ───────────────────────────────── */
    .section-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    /* ── Steppers ────────────────────────────────────── */
    .stepper-group { display: flex; align-items: center; gap: 0.5rem; }
    .stepper-group input { text-align: center; width: 80px; }
    .stepper-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .stepper-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    /* ── Numeric typography ──────────────────────────── */
    .num { font-family: 'JetBrains Mono', monospace; }

    /* ── Flash messages ──────────────────────────────── */
    .flash {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.875rem;
    }
    .flash-success {
      background: rgba(52,211,153,0.08);
      border: 1px solid rgba(52,211,153,0.25);
      color: var(--success);
    }
    .flash-error {
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.25);
      color: var(--danger);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <span class="brand">
      <span class="brand-dot"></span>
      FitStorm
    </span>
    <span class="nav-sep"></span>
    <div class="nav-links" id="nav-links">
      <a href="/">Dashboard</a>
      <a href="/stats">Stats</a>
      <a href="/workouts">Workouts</a>
      <a href="/exercises">Exercises</a>
      <a href="/cardio">Cardio</a>
      <a href="/metrics">Body Metrics</a>
      <a href="/export">Export</a>
      {% if user.is_admin %}
      <a href="/invite">Invite</a>
      {% endif %}
      <div class="nav-mobile-user">
        <a href="/settings" class="username">{{ user.username }}</a>
        <form method="post" action="/logout">
          <button type="submit" class="btn btn-ghost"
                  style="min-height:34px;padding:0.35rem 0.75rem;font-size:0.8rem;">
            Sign out
          </button>
        </form>
      </div>
    </div>
    <div class="nav-user">
      <a href="/settings" class="username">{{ user.username }}</a>
      <form method="post" action="/logout" style="display:flex;align-items:center;">
        <button type="submit" class="btn btn-ghost"
                style="min-height:30px;padding:0.3rem 0.7rem;font-size:0.78rem;white-space:nowrap;border-color:#2a3248;color:var(--text);">
          Sign out
        </button>
      </form>
    </div>
    <button class="nav-hamburger" id="nav-hamburger"
            onclick="toggleMobileNav()" aria-label="Toggle navigation">
      <i data-lucide="menu" style="width:20px;height:20px;pointer-events:none;"></i>
    </button>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
    document.querySelectorAll('.nav-links a').forEach(function(a) {
      if (a.closest('.nav-mobile-user')) return;
      var linkPath = new URL(a.href).pathname;
      var here = location.pathname;
      if (linkPath === '/' ? here === '/' : here === linkPath || here.startsWith(linkPath + '/')) {
        a.classList.add('active');
      }
    });
    function toggleMobileNav() {
      var links = document.getElementById('nav-links');
      var btn = document.getElementById('nav-hamburger');
      var open = links.classList.toggle('nav-open');
      btn.setAttribute('aria-expanded', open);
    }
    // Close menu when a nav link is tapped on mobile
    document.querySelectorAll('#nav-links a').forEach(function(a) {
      a.addEventListener('click', function() {
        document.getElementById('nav-links').classList.remove('nav-open');
      });
    });
    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
    document.addEventListener('htmx:afterSwap', () => lucide.createIcons());
  </script>
</body>
</html>
