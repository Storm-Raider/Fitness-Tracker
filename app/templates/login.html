<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Zenkai</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#f4f4f1">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <style>
    /* Daylight (DESIGN.md). Standalone page (no base.html), so the tokens are
       copied from base.html's :root; keep the two in step. */
    :root {
      color-scheme: light;
      --bg:           #f4f4f1;   /* paper */
      --surface:      #ffffff;   /* card */
      --surface-2:    #f7f7f4;   /* done sets, nested panels */
      --surface-hover:#efefea;
      --border:       #dddcd6;   /* hairlines (decorative) */
      --border-mid:   #c9c8c2;   /* secondary-button borders */
      --ring:         #8f8e88;   /* input and empty-tick outlines, 3.3:1 */
      --text:         #141414;   /* ink */
      --muted:        #5d5d58;   /* pencil, 6.0:1 on paper */
      --muted-hi:     #4a4a46;
      --accent:       #141414;   /* interactive text and active states: ink */
      --accent-hover: #3a3a37;
      --accent-dim:   rgba(20,20,20,0.06);
      --primary:      #ff5a1f;   /* signal orange: always a fill with ink text */
      --primary-hover:#f04e14;
      --on-primary:   #141414;
      --primary-edge: #e04a12;   /* orange outlines, 3.7:1; never text */
      --primary-tint: #fff4ee;
      --danger:       #c8372d;
      --danger-dim:   #fdecea;
      --success:      #1f7a4d;
      --success-dim:  #e8f4ee;
      --pr:           #8c5a00;   /* records only */
      --pr-dim:       #fff3d6;
      --pr-glow:      rgba(227,179,65,0.45);
      --live:         #e04a12;   /* live-session marks (dots, outlines); never text */
      --live-dim:     #fff4ee;
      --live-glow:    rgba(224,74,18,0.3);
      --data:         #141414;   /* single-series charts */
      --accent-glow:  rgba(20,20,20,0.2);
      --shadow-sm:    0 1px 2px rgba(20,20,20,0.06), 0 4px 14px rgba(20,20,20,0.06);
      --shadow:       0 6px 20px rgba(20,20,20,0.10);
      --shadow-lg:    0 12px 36px rgba(20,20,20,0.16);
      --glow:         0 0 0 3px rgba(20,20,20,0.12);
      --glow-pr:      0 0 0 3px rgba(140,90,0,0.18);
      --radius:       18px;
      --radius-sm:    14px;
      --radius-xs:    10px;
      --f-display: 'Archivo', 'Arial', system-ui, sans-serif;
      --f-ui: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif;
      /* Spacing scale — 8px base */
      --sp-2xs:  2px;
      --sp-xs:   4px;
      --sp-sm:   8px;
      --sp-md:   16px;
      --sp-lg:   24px;
      --sp-xl:   32px;
      --sp-2xl:  48px;
      --sp-3xl:  64px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    a, button, input, label { touch-action: manipulation; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--f-ui);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    *:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(14vh, env(safe-area-inset-top, 0px) + 48px) 16px 48px;
    }
    .wrap, .login-wrap { width: 100%; max-width: 400px; }
    .wordmark {
      font-family: var(--f-display);
      font-weight: 800;
      font-size: 2.25rem;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--text);
      text-align: center;
    }
    .tagline {
      text-align: center;
      font-size: 1rem;
      color: var(--muted);
      margin: 0.4rem 0 1.75rem;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    h2 {
      font-family: var(--f-display);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.005em;
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }
    .flash-error, .flash-success {
      border-radius: var(--radius-sm);
      padding: 0.875rem 1rem;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }
    .flash-error { background: var(--danger-dim); color: var(--danger); }
    .flash-success { background: var(--success-dim); color: var(--success); }
    form > div { margin-bottom: 1.1rem; }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      display: block;
      width: 100%;
      height: 52px;
      background: var(--surface);
      border: 1px solid var(--ring);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 0 0.95rem;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: 2px solid var(--text);
      outline-offset: 0;
      border-color: var(--text);
    }
    .hint-text, .field-error {
      font-size: 0.8125rem;
      line-height: 1.4;
      margin-top: 0.4rem;
    }
    .hint-text { color: var(--muted); }
    .field-error { color: var(--danger); font-weight: 600; }
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      margin-top: 0.5rem;
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 1.0625rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    /* Force 16px on inputs unconditionally to stop tap-to-zoom on every
       touch device (width/pointer queries miss iPad+trackpad & landscape). */
    input, select, textarea { font-size: 16px !important; }
    .row-remember {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin: -0.25rem 0 0.75rem;
    }
    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      min-height: 44px;
      margin: 0;
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .remember-label input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--text);
      cursor: pointer;
      margin: 0;
    }
    .forgot-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
    }
    .forgot-link:hover { text-decoration-thickness: 2px; }
    .hint {
      text-align: center;
      font-size: 0.9375rem;
      color: var(--muted);
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <main class="login-wrap">
    <h1 class="wordmark">Zenkai</h1>
    <p class="tagline">Your lifts. Your data. Your server.</p>
    <div class="card">
      {% if request.query_params.get('reset') %}
      <div class="flash-success" role="status">Password updated — sign in with your new password.</div>
      {% endif %}
      {% if error %}
      <div class="flash-error" role="alert">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next | e }}">
        <div>
          <label for="username">Username</label>
          <input type="text" id="username" name="username"
                 autocomplete="username"
                 value="{{ prefill_username | e }}"
                 {% if not prefill_username %}autofocus{% endif %}
                 required>
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password"
                 {% if prefill_username %}autofocus{% endif %}
                 required>
        </div>
        <div class="row-remember">
          <label class="remember-label">
            <input type="checkbox" name="remember" value="true">
            Remember me
          </label>
          <a href="/forgot-password" class="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn-primary">Sign in</button>
      </form>
    </div>
    <p class="hint">Need access? Ask your server admin for an invite link.</p>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
