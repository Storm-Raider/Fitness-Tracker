<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
  <title>Sign in — Zenkai</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#eef1ec">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <style>
{% include "partials/auth_style.html" %}
    .row-remember {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin: -0.25rem 0 0.75rem;
    }
    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      min-height: 44px;
      margin: 0;
      font-size: var(--t-body);
      font-weight: 400;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .remember-label input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--text);
      cursor: pointer;
      margin: 0;
    }
    .forgot-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font-size: var(--t-body);
      font-weight: 600;
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
    }
    .forgot-link:hover { text-decoration-thickness: 2px; }
    .hint {
      text-align: center;
      font-size: var(--t-body);
      color: var(--muted);
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <main class="login-wrap">
    <h1 class="wordmark">Zenkai</h1>
    <p class="tagline">Your lifts. Your data. Your server.</p>
    <div class="card">
      {% if request.query_params.get('reset') %}
      <div class="flash-success" role="status">Password updated — sign in with your new password.</div>
      {% endif %}
      {% if error %}
      <div class="flash-error" role="alert">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next | e }}">
        <div>
          <label for="username">Username</label>
          <input type="text" id="username" name="username"
                 autocomplete="username"
                 value="{{ prefill_username | e }}"
                 {% if not prefill_username %}autofocus{% endif %}
                 required>
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password"
                 {% if prefill_username %}autofocus{% endif %}
                 required>
        </div>
        <div class="row-remember">
          <label class="remember-label">
            <input type="checkbox" name="remember" value="true">
            Remember me
          </label>
          <a href="/forgot-password" class="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn-primary">Sign in</button>
      </form>
    </div>
    <p class="hint">Need access? Ask your server admin for an invite link.</p>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
