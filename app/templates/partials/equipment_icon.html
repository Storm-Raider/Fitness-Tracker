{#
  Equipment pictograms for the Plan page setup, drawn for Zenkai in the drafting
  style (DESIGN.md): 24px grid, 1.75px ink line, round caps, no fill.
  Usage: {% from "partials/equipment_icon.html" import eq_icon %}{{ eq_icon("barbell") }}
#}
{% macro eq_icon(key, size=36) -%}
<svg class="eq-icon" viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" aria-hidden="true" focusable="false"
     fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
{%- if key == "barbell" %}
  <path d="M1.5 12h21"/><rect x="4" y="6.5" width="2.5" height="11" rx="0.8"/><rect x="17.5" y="6.5" width="2.5" height="11" rx="0.8"/>
  <rect x="6.5" y="8.5" width="1.6" height="7" rx="0.6"/><rect x="15.9" y="8.5" width="1.6" height="7" rx="0.6"/>
{%- elif key == "dumbbell" %}
  <path d="M8 12h8"/><rect x="3.5" y="8" width="4.5" height="8" rx="1.2"/><rect x="16" y="8" width="4.5" height="8" rx="1.2"/>
  <path d="M2.5 10.5v3M21.5 10.5v3"/>
{%- elif key == "kettlebell" %}
  <path d="M8.8 10.6V8.2a3.2 3.2 0 0 1 6.4 0v2.4"/><path d="M7.3 20.5a6 6 0 1 1 9.4 0z"/><path d="M10 14.5a2.4 2.4 0 0 1 2-1.3"/>
{%- elif key == "bench" %}
  <rect x="2.5" y="9" width="19" height="3.2" rx="1"/><path d="M6 12.2v6.8M18 12.2v6.8M4 19h4M16 19h4"/><path d="M12 12.2v3"/>
{%- elif key == "pullup_bar" %}
  <path d="M2.5 4.5h19M4.5 2.5v4M19.5 2.5v4"/><circle cx="12" cy="10.2" r="1.7"/>
  <path d="M8.6 4.5l3.4 4M15.4 4.5L12 8.5"/><path d="M12 12v5M12 17l-2 4.5M12 17l2 4.5"/>
{%- elif key == "dip_bars" %}
  <path d="M2.5 8.5h7M14.5 8.5h7"/><path d="M4 8.5V21M8 8.5V21M16 8.5V21M20 8.5V21"/><path d="M3 21h6M15 21h6"/>
{%- elif key == "cable" %}
  <rect x="2.5" y="3" width="6.5" height="18" rx="1"/><path d="M4.5 7.5h2.5M4.5 10.5h2.5M4.5 13.5h2.5"/>
  <circle cx="16" cy="5.5" r="2"/><path d="M9 3.6h7M16 7.5v8.5"/><path d="M13 16h6M13.5 16v2.2M18.5 16v2.2"/>
{%- elif key == "machine" %}
  <path d="M5 3.5v11h8.5"/><path d="M8 14.5V21M13.5 14.5V21M6 21h9.5"/><path d="M5 9.5h3"/>
  <rect x="17" y="3.5" width="4.5" height="17.5" rx="1"/><path d="M17 8h4.5M17 12h4.5M19.25 3.5v-1"/>
{%- elif key == "ez_bar" %}
  <path d="M2 12h4.5c1.2 0 1.6-2.4 2.8-2.4s1.6 4.8 2.7 4.8 1.5-4.8 2.7-4.8 1.6 2.4 2.8 2.4H22"/>
  <rect x="3" y="7.5" width="2.2" height="9" rx="0.7"/><rect x="18.8" y="7.5" width="2.2" height="9" rx="0.7"/>
{%- elif key == "band" %}
  <path d="M5 3v4.5M19 3v4.5"/><path d="M3.5 3h3M17.5 3h3"/><path d="M5 7.5c0 7 4.5 13 7 13s7-6 7-13"/>
{%- elif key == "medicine_ball" %}
  <circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c3.2 2.6 3.2 14.4 0 17M12 3.5c-3.2 2.6-3.2 14.4 0 17"/>
{%- elif key == "stability_ball" %}
  <circle cx="12" cy="11" r="8.5"/><path d="M4.5 21.5h15"/><path d="M8 7.2a5 5 0 0 1 3.5-1.7"/>
{%- elif key == "bodyweight" %}
  <circle cx="12" cy="4.5" r="2"/><path d="M12 7v7M7 9.5l5-1.5 5 1.5M12 14l-3.5 7M12 14l3.5 7"/>
{%- endif %}
</svg>
{%- endmacro %}
