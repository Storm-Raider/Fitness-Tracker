{% if workouts %}
<div class="card">
  <table>
    <thead>
      <tr><th>Date</th><th>Notes</th><th></th></tr>
    </thead>
    <tbody>
      {% for w in workouts %}
      <tr>
        <td><a href="/workouts/{{ w.id }}">{{ w.started_at[:10] }}</a></td>
        <td style="color:var(--muted);">{{ w.notes or "—" }}</td>
        <td><a href="/workouts/{{ w.id }}" class="btn btn-ghost" style="padding:0.25rem 0.6rem;">Open</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<div class="card">
  <p style="color:var(--muted); font-size:0.875rem;">No workouts yet. Hit <strong>+ New Workout</strong> to begin.</p>
</div>
{% endif %}
