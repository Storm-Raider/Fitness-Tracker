<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Error — FitTrack</title>
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090b10;
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 0);
      background-size: 28px 28px;
      color: #e4eaf2;
      font-family: 'Barlow', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    .code {
      font-family: 'Syne', system-ui, sans-serif;
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #1c2230;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .msg {
      font-family: 'Syne', system-ui, sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      color: #5a6a82;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 1.25rem;
      min-height: 40px;
      background: linear-gradient(135deg, #4f9cf9, #3b82f6);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: 'Barlow', system-ui, sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn:hover {
      background: linear-gradient(135deg, #7ab8fc, #4f9cf9);
      box-shadow: 0 4px 16px rgba(79,156,249,0.35);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="code">500</div>
  <div class="msg">Something went wrong</div>
  <div class="sub">An internal error occurred. Try again in a moment.</div>
  <a href="/" class="btn">Go to dashboard</a>
</body>
</html>
