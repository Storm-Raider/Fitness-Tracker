<div id="recent-workouts">
  {% if workouts %}
  <div style="display:flex;flex-direction:column;gap:0.5rem;">
    {% for w in workouts %}
    <a href="/workouts/{{ w.id }}" style="display:block;text-decoration:none;color:inherit;">
      <div class="card" style="padding:0.875rem 1rem;transition:border-color 0.15s,box-shadow 0.15s;"
           onmouseover="this.style.borderColor='#3d4459';this.style.boxShadow='0 4px 16px rgba(0,0,0,0.4)'"
           onmouseout="this.style.borderColor='';this.style.boxShadow=''">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:0.75rem;">
          <div style="font-weight:600;font-size:0.875rem;">{{ w.started_at[:10] }}</div>
          <div style="display:flex;align-items:center;gap:0.75rem;flex-shrink:0;">
            {% if w.set_count > 0 %}
            <span style="font-size:0.8rem;color:var(--muted);">{{ w.set_count }} sets</span>
            {% endif %}
            {% if w.notes %}
            <span style="font-size:0.8rem;color:var(--muted);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ w.notes }}</span>
            {% endif %}
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </div>
        </div>
      </div>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <div class="card">
    <p style="color:var(--muted);font-size:0.875rem;">No workouts logged yet. <a href="/workouts">Start one!</a></p>
  </div>
  {% endif %}
</div>
