<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
  <title>Set new password — Zenkai</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#eef1ec">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <style>
{% include "partials/auth_style.html" %}
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="wordmark">Zenkai</h1>
    <p class="tagline">Set a new password</p>
    <div class="card">
      <h2>Choose a new password</h2>
      <form method="post" action="/reset-password/{{ token | e }}">
        <div>
          <label for="password">New password</label>
          <input type="password" id="password" name="password"
                 autocomplete="new-password"
                 minlength="8"
                 autofocus required>
          {% if errors.get('password') %}
          <p class="field-error">{{ errors.password }}</p>
          {% else %}
          <p class="hint-text">Minimum 8 characters</p>
          {% endif %}
        </div>
        <div>
          <label for="password_confirm">Confirm new password</label>
          <input type="password" id="password_confirm" name="password_confirm"
                 autocomplete="new-password"
                 minlength="8"
                 required>
          {% if errors.get('password_confirm') %}
          <p class="field-error">{{ errors.password_confirm }}</p>
          {% else %}
          <div class="spacer"></div>
          {% endif %}
        </div>
        <button type="submit" class="btn-primary">Update password</button>
      </form>
    </div>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
