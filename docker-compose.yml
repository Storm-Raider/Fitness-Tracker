services:
  fitstorm:
    build: .
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - fitness_data:/data
    environment:
      - DATABASE_PATH=/data/fitness.db
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - APP_SECRET=${APP_SECRET}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - SESSION_DAYS=${SESSION_DAYS:-30}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    restart: unless-stopped

volumes:
  fitness_data:
