services:
  fittrack:
    build: .
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - fitness_data:/data
    environment:
      - DATABASE_PATH=/data/fitness.db
      - APP_PASSWORD=${APP_PASSWORD}
      - APP_SECRET=${APP_SECRET}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - SESSION_DAYS=${SESSION_DAYS:-30}
    restart: unless-stopped

volumes:
  fitness_data:
